services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pinch
      POSTGRES_USER: pinch
      POSTGRES_PASSWORD: pinch
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pinch"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      # Postgres 18+ images manage major-version subdirectories themselves;
      # mount the parent dir, not .../data. See docker-library/postgres#1259.
      - database_data:/var/lib/postgresql

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
      - path: ./backend/.env.local
        required: false
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor

  frontend:
    build: ./frontend
    env_file:
      - path: ./frontend/.env.local
        required: false
    environment:
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  database_data:
  backend_vendor:
  frontend_node_modules:
